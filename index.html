<html>
    <head>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="container mb-3">
                <label for="players" class="form-label">Players</label>
                <input type="text" class="form-control" id="players" placeholder="e.g. Jim,James" onChange="calculateFixtures()">
            </div>

            <div class="container mb-3">
                <label class="form-label">Fixtures / Scores</label>
                <div id="fixtures"/>
            </div>
            
            </div>
        </div>
    </body>
    <script>
        function calculateFixtures()
        {
            players = $("#players").val().split(',');
        r=2;
        n=players.length;
        data=new Array(r);
        fixtures=new Array();
        combinationUtil (players,n,r,0,data,0,fixtures);
            fixturesHTML='';
        for (var i=0; i<fixtures.length; i++) {
            fixturesHTML+=' \
            <div class="input-group"> \
            <span class="input-group-text col-4">'+fixtures[i][0]+'</span> \
            <input type="text" class="form-control col-2" id="P1'+i+'"> \
            <span class="input-group-text col-4">'+fixtures[i][1]+'</span> \
            <input type="text" class="form-control col-2" id="P2'+i+'"> \
            </div> \
            '
        }
            $("#fixtures").html(fixturesHTML);
        }

        function combinationUtil(arr,n,r,index,data,i,fixtures)
        {
        if (index == r)
        {
            fixtures[fixtures.length]=[data[0],data[1]];
            return;
        }

        if (i >= n)
        {
            return;
        }

        data[index] = arr[i];
        combinationUtil(arr, n, r, index+1, data, i+1,fixtures);

        combinationUtil(arr, n, r, index, data, i+1,fixtures);

        }
    </script>
</html>
