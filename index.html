<html>
    <head>
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <div class="container">
            <div class="container mb-3 mt-3">
                <label class="form-label">Players</label>
                <div class="input-group">
                  <input type="text" class="form-control col-10" id="players" placeholder="e.g. Jim,James" onChange="calculateFixtures()">
                  <button type="button" id="playerEntryLock" class="btn btn-success col-2" onClick="toggleLock()">
                    <i class="bi bi-unlock" id="playerEntryLockIcon"></i>
                  </button>
                </div>
            </div>
            <div class="mb-3 container">
              <label class="form-label">Current Games</label>
              <div id="playing"></div>
            </div>
            <div class="mb-3 container">
              <label class="form-label">Completed Games</label>
              <div id="completed"></div>
            </div>
            <div class="mb-3 container">
              <label class="form-label">Match Results</label>
              <div id="matchResults"></div>
            </div>
            <div class="mb-3 container">
              <label class="form-label">Frame Results</label>
              <div id="results"></div>
            </div>
            <div class="mb-3 container">
              <label class="form-label">Tournament State</label>
              <div id="tournamentState">
                  <button type="button" class="btn btn-success col-2" onClick="clipboardTournamentState()">
                    <i class="bi bi-clipboard"></i>
                  </button>
              </div>
            </div>
          </div>
    </body>
    <script>
        var fixtures;
        var playing;
        var players;
        var currentGames;
        var completedGames
        var results;
        var matchResults;

        function calculateFixtures()
        {
            players = $("#players").val().split(',').map(function(item) {return item.trim()});
            r=2;
            n=players.length;
            data=new Array(r);
            fixtures=new Array();
            playing=new Array();
            currentGames=new Array();
            completedGames=new Array();
            results=new Array();
            matchResults=new Array();
            combinationUtil (players,n,r,0,data,0);
            console.log(fixtures);
						calcCurrentGames();
						showCurrentGames();
            toggleLock();
        }

				function toggleLock() {
        			$("#playerEntryLockIcon").toggleClass("bi-unlock").toggleClass("bi-lock").parent().toggleClass("btn-success").toggleClass("btn-danger").parent().find('input').prop('disabled', function(i, v) { return !v; });
        }

        function combinationUtil(arr,n,r,index,data,i) {
          if (index == r) {
              // fixture format [playerA, playerB, fixturePlayed]
              fixtures[fixtures.length]=[data[0],data[1],false];
              return;
          }

          if (i >= n) {
              return;
          }

          data[index] = arr[i];
          combinationUtil(arr, n, r, index+1, data, i+1);
          combinationUtil(arr, n, r, index, data, i+1);
        }

        function showCompletedGames() {
        // show completed games
 		        // show current games that should be played
            fixturesHTML='';
            for (var i=0; i<completedGames.length; i++) {
            		colourP1=completedGames[i][1]==2?'text-bg-success':'text-bg-secondary';
            		colourP2=completedGames[i][2]==2?'text-bg-success':'text-bg-secondary';
                fixturesHTML+=' \
                <div class="input-group mb-1"> \
                <span class="input-group-text col-3">'+fixtures[completedGames[i][0]][0]+'</span> \
                <input type="text" class="form-control col-2 '+colourP1+' text-center" value="'+completedGames[i][1]+'" disabled> \
                <span class="input-group-text col-3">'+fixtures[completedGames[i][0]][1]+'</span> \
                <input type="text" class="form-control col-2 '+colourP2+' text-center" value="'+completedGames[i][2]+'" disabled> \
                <button type="button" class="btn btn-danger col-2"> \
                	<i class="bi bi-pencil"></i> \
                </button> \
                </div> \
                '
            }
            $("#completed").html(fixturesHTML);        

        }

        function calcCurrentGames() {
            //calculate next game(s) from two players not playing
            var found;
            nGamesInMotion = currentGames.length;
            for (var j=0; j<(Math.floor(players.length/2)-nGamesInMotion); j++) {
		         		found=false;
                for (var i=0; (i<fixtures.length)&&(!found); i++) {
                    // next fixture up for consideration
                    if (!playing.includes(fixtures[i][0]) && !playing.includes(fixtures[i][1]) && !fixtures[i][2]) {
                        playing[playing.length]=fixtures[i][0];
                        playing[playing.length]=fixtures[i][1];
                        currentGames[currentGames.length]=i;
                        found=true;
                    }
                }
					  }
        }
        
        function showCurrentGames() {
 		        // show current games that should be played
            fixturesHTML='';
            for (var i=0; i<currentGames.length; i++) {
                fixturesHTML+=' \
                <div class="input-group mb-1"> \
                <span class="input-group-text col-3">'+fixtures[currentGames[i]][0]+'</span> \
                <input type="text" inputmode="numeric" class="form-control col-2 text-center number-only" maxlength="1" id="P-1-'+currentGames[i]+'"> \
                <span class="input-group-text col-3">'+fixtures[currentGames[i]][1]+'</span> \
                <input type="text" inputmode="numeric" class="form-control col-2 text-center number-only" maxlength="1" id="P-2-'+currentGames[i]+'"> \
                <button type="button" class="btn btn-success col-2" id="postScore'+i+'" onClick="postScore('+i+','+currentGames[i]+')"> \
                	<i class="bi bi-check2"></i> \
                </button> \
                </div> \
                '
            }
            $("#playing").html(fixturesHTML);
            attachInputControls();    
        }

        function showFrameResults() {
          // show results as of current completed game states
          results=new Array();
          for (var i=0; i<completedGames.length; i++) {
						fixture=completedGames[i][0];
            if (!(fixtures[fixture][0] in results)) results[fixtures[fixture][0]]=0;
            if (!(fixtures[fixture][1] in results)) results[fixtures[fixture][1]]=0;
            results[fixtures[fixture][0]]+=Number(completedGames[i][1]);
            results[fixtures[fixture][1]]+=Number(completedGames[i][2]);
          }
          console.log(results);
          resultsHTML="";
          var players = Object.keys(results);
    			players.sort();
          for (var i=0; i<players.length; i++) {
          	resultsHTML+=' \
                <div class="input-group mb-1"> \
                <span class="input-group-text col-4">'+players[i]+'</span> \
                <span class="input-group-text col-2 text-center">'+results[players[i]]+'</span> \
								</div>'
          }
          $("#results").html(resultsHTML);        
          showMatchResults();
        }

        function showMatchResults() {
          // show results as of current completed game states
          matchResults=new Array();
          for (var i=0; i<completedGames.length; i++) {
						fixture=completedGames[i][0];
            if (!(fixtures[fixture][0] in matchResults)) matchResults[fixtures[fixture][0]]=0;
            if (!(fixtures[fixture][1] in matchResults)) matchResults[fixtures[fixture][1]]=0;
            if (completedGames[i][1]==2) {
              matchResults[fixtures[fixture][0]]+=1;
            } else {
              matchResults[fixtures[fixture][1]]+=1;
            }
          }
          resultsHTML="";
          var players = Object.keys(matchResults);
    			players.sort();
          for (var i=0; i<players.length; i++) {
          	resultsHTML+=' \
                <div class="input-group mb-1"> \
                <span class="input-group-text col-4">'+players[i]+'</span> \
                <span class="input-group-text col-2 text-center">'+matchResults[players[i]]+'</span> \
								</div>'
          }
          $("#matchResults").html(resultsHTML);
        }

        function postScore(game,fixture) {
        	//trap invalid score posts
          //score without a 2
          score1=Number($('#P-1-'+fixture).val());
          score2=Number($('#P-2-'+fixture).val());
          if ((score1!=2 && score2!=2) || (score1==2 && score2==2)) {
          	$("#postScore"+game).toggleClass("btn-success").toggleClass("btn-danger").prop('disabled', function(i, v) { return !v; });
            setTimeout(function(){
            	$("#postScore"+game).toggleClass("btn-success").toggleClass("btn-danger").prop('disabled', function(i, v) { return !v; });
            },1000)
          } else {
            //both scores 2
            completedGames[completedGames.length]=[fixture,score1,score2];
            //remove completed game from currentGames
            currentGames.splice(game,1);
            //put players back on the bench
            playing.splice(playing.indexOf(fixtures[fixture][0]),1);
            playing.splice(playing.indexOf(fixtures[fixture][1]),1);
            // mark fixture as played
            fixtures[fixture][2]=true;
            // calc next game and show
            calcCurrentGames();
            showCurrentGames();

            showCompletedGames();
            showFrameResults();
            //clipboardTournamentState();
          }
        }


        function attachInputControls () {
          $("input.number-only").unbind("keypress");
          $("input.number-only").bind("keypress", function(e) {
            if(e.keyCode<48 || e.keyCode>50) {
              return false;
            }
          })
        }

        function clipboardTournamentState () {
          baseURL=document.location.origin+document.location.pathname;
          playersString=JSON.stringify(players);
          completedGamesString=JSON.stringify(completedGames);
          URLParams=new URLSearchParams([["players",playersString],["completedGames",completedGamesString]]);
          navigator.clipboard.writeText(baseURL+"?"+URLParams);
        }

        $(document).ready(function() {
          //parse any content supplied in search params
          if (document.location.search!="") {
            params=new URLSearchParams(document.location.search);
            if (params.get("players")!=null) {
              $("#players").val(JSON.parse(params.get("players")).join()).trigger('change');
              if (params.get("completedGames")!=null) {
                completedGames=JSON.parse(params.get("completedGames"));
                for (var i=0; i<completedGames.length; i++) {
                  fixtures[completedGames[i][0]][2]=true;
                }
                currentGames=new Array();
                playing=new Array();
                calcCurrentGames();
                showCurrentGames();

                showCompletedGames();
                showFrameResults();
              }
            }
          }
        })
</script>
</html>
